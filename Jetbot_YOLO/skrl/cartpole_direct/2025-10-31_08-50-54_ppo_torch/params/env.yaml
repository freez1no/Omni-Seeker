camera_cfg:
  class_type: isaaclab.sensors.camera.camera:Camera
  prim_path: /World/envs/env_.*/Robot/camera_sensor
  update_period: 0.02
  history_length: 0
  debug_vis: false
  offset:
    pos: !!python/tuple
    - 0.1
    - 0.0
    - 0.1
    rot: !!python/tuple
    - 0.0
    - 0.0
    - 0.0
    - 1.0
    convention: ros
  spawn:
    func: isaaclab.sim.spawners.sensors.sensors:spawn_camera
    visible: true
    semantic_tags: null
    copy_from_source: true
    projection_type: pinhole
    clipping_range: !!python/tuple
    - 0.01
    - 1000000.0
    focal_length: 24.0
    focus_distance: 400.0
    f_stop: 0.0
